<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Path for curved bottom text -->
    <path id="katas-arc" d="M 75 220 A 90 90 0 0 0 225 220" fill="none" />
  </defs>

  <!-- Outer circular badge border -->
  <circle cx="150" cy="150" r="136" fill="#0E1626" stroke="#22334F" stroke-width="4"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="#3178C6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Left Fold: JavaScript Yellow Shield -->
  <path d="M 143 78 L 64 108 L 74 186 L 143 172 Z" 
        fill="#F7DF1E" rx="4"/>
  <!-- JS Text -->
  <text x="104" y="152" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        fill="#1E293B" 
        text-anchor="middle" 
        letter-spacing="-1">JS</text>

  <!-- Right Fold: TypeScript Blue Shield -->
  <path d="M 157 78 L 236 108 L 226 186 L 157 172 Z" 
        fill="#3178C6" rx="4"/>
  <!-- TS Text -->
  <text x="196" y="152" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="-1">TS</text>

  <!-- Center Katana (Blade & Handle) -->
  <!-- Handle (Tsuka) -->
  <rect x="146.5" y="32" width="7" height="34" rx="2" fill="#182234" stroke="#F8FAFC" stroke-width="1.2"/>
  <!-- Diamond wrap details (Menuki/Tsukamaki) -->
  <polygon points="150,38 148,42 150,46 152,42" fill="#F7DF1E"/>
  <polygon points="150,48 148,52 150,56 152,52" fill="#3178C6"/>
  <polygon points="150,58 148,62 150,66 152,62" fill="#F7DF1E"/>

  <!-- Guard (Tsuba) -->
  <rect x="139" y="66" width="22" height="4.5" rx="2" fill="#E2E8F0"/>

  <!-- Blade (Ha & Shinogi) -->
  <path d="M 148.5 70.5 L 148.5 190 Q 148.5 204 153.5 210 Q 151.5 194 151.5 70.5 Z" 
        fill="#F8FAFC"/>
  <!-- Katana cutting edge reflection -->
  <path d="M 150 70.5 L 150 190 Q 150 202 153.5 210 Q 151.5 194 151.5 70.5 Z" 
        fill="#94A3B8"/>

  <!-- Bottom Label: KATAS -->
  <text fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="9">
    <textPath href="#katas-arc" startOffset="50%" text-anchor="middle">
      KATAS
    </textPath>
  </text>
</svg>
